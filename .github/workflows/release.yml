name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build npm package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-15
          - platform: darwin-x64
            os: macos-15-intel
          - platform: win32-x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            echo "Version is empty." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm"
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Test backend
        run: mvn test

      - name: Test frontend
        run: |
          cd frontend
          pnpm test
          pnpm typecheck

      - name: Build native backend
        id: backend
        run: |
          backend_path="$(scripts/build-backend-native.sh)"
          echo "smoke_path=$backend_path" >> "$GITHUB_OUTPUT"
          if [[ "${{ matrix.platform }}" == win32-* ]]; then
            backend_path="$(cygpath -w "$backend_path")"
          fi
          echo "path=$backend_path" >> "$GITHUB_OUTPUT"

      - name: Check native metadata
        run: node scripts/check-openai-native-metadata.mjs

      - name: Smoke native backend
        run: |
          node scripts/smoke-native-backend.mjs \
            --backend "${{ steps.backend.outputs.smoke_path }}" \
            --version "${{ steps.version.outputs.version }}" \
            --ensure-test-config true

      - name: Stage platform npm package
        run: |
          node scripts/stage-npm-packages.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --platform "${{ matrix.platform }}" \
            --backend "${{ steps.backend.outputs.path }}" \
            --package platform \
            --pack

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: target/npm/dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build main npm package
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          node scripts/stage-npm-packages.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --package main \
            --pack

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect main package
        run: |
          cp target/npm/dist/*.tgz dist/

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is required to publish npm packages." >&2
            exit 1
          fi

          version="${{ steps.version.outputs.version }}"

          publish_if_missing() {
            package_name="$1"
            tarball="$2"
            if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
              echo "${package_name}@${version} already exists on npm; skipping."
            else
              if [ ! -f "$tarball" ]; then
                echo "Package tarball does not exist: $tarball" >&2
                find dist -maxdepth 2 -type f -print >&2
                exit 1
              fi
              npm publish "./$tarball" --access public
            fi
          }

          publish_if_missing "@lingjiuu/aether-darwin-arm64" "dist/lingjiuu-aether-darwin-arm64-${version}.tgz"
          publish_if_missing "@lingjiuu/aether-darwin-x64" "dist/lingjiuu-aether-darwin-x64-${version}.tgz"
          publish_if_missing "@lingjiuu/aether-win32-x64" "dist/lingjiuu-aether-win32-x64-${version}.tgz"
          publish_if_missing "@lingjiuu/aether" "dist/lingjiuu-aether-${version}.tgz"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tgz > checksums.txt
          cat checksums.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Aether $tag" --generate-notes
          fi
